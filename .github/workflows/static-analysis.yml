name: static-analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned ShellCheck
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/$archive"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"
      - name: ShellCheck
        run: |
          shellcheck --version
          .github/scripts/lint-shell.sh

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEMGREP_VERSION: 1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: Semgrep
        # Registry rulesets, no semgrep.dev token. WARNING and ERROR findings
        # fail the job; INFO-rated rules are not run.
        run: |
          semgrep scan --metrics=off --error --severity WARNING --severity ERROR \
            --config r/bash --config p/python --config p/github-actions \
            --config p/security-audit --config p/secrets
