name: SonarCloud

# SonarCloud analysis runs from GitHub Actions on every repository in the
# org, private repositories included (owner decision, 2026-11-04).
# Automatic Analysis stays off, because SonarCloud rejects a CI scan while
# it is on.
#
# Protected bridge: no job that runs on pull_request ever holds SONAR_TOKEN.
# A PR controls this file, the scanner config and the tree, so a token in a
# PR job could be exfiltrated. Instead:
#   1. pull_request: `sync-coverage` runs the PR's tests with no secret and
#      uploads the report; `protected-sonar` (no secret) dispatches this
#      workflow on main and waits for it.
#   2. workflow_dispatch on main: the `sonarcloud` job, bound to the
#      `protected-sonar` environment (deployable from main only), re-checks the
#      caller run and PR against the API with scripts/protected_sonar.py from
#      main, takes the coverage report as bounded data, writes the PR tree out
#      as plain files, and scans it with main's sonar-project.properties. The
#      SonarCloud App then posts the required `SonarCloud Code Analysis` check.
#   3. push to main: the same job scans main with that run's coverage.
# The PR-side dispatcher is PR-controlled and trusted for nothing: an edited
# copy can only dispatch main's code, or reach a non-main ref that the
# environment refuses (and `reject-disabled-dispatch` fails loudly).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      caller_run_id:
        description: "Dispatching pull_request run ID"
        type: string
        required: true
      caller_run_attempt:
        description: "Dispatching run attempt"
        type: string
        required: true
      pr_number:
        description: "Candidate PR number"
        type: string
        required: true
      expected_head_sha:
        description: "Candidate PR head SHA"
        type: string
        required: true
      expected_base_sha:
        description: "Candidate PR base SHA"
        type: string
        required: true

permissions: {}

concurrency:
  group: sonarcloud-${{ github.event_name == 'workflow_dispatch' && format('pr-{0}', inputs.pr_number) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync-coverage:
    name: Shared sync coverage
    # PR-controlled tests run in a job without the Sonar secret. Fork PRs get
    # no dispatch permission, so they are not measured.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure integration coverage
        env:
          ARCHITECT_REQUIRE_LINUX_SANDBOX: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/sync-coverage-venv"
          "$RUNNER_TEMP/sync-coverage-venv/bin/python" -m pip install --only-binary=:all: --require-hashes --no-deps -r scripts/requirements-protected-sonar.txt
          "$RUNNER_TEMP/sync-coverage-venv/bin/python" -m pip install --no-deps 'coverage @ https://files.pythonhosted.org/packages/ec/16/114df1c291c22cac3b0c127a73e0af5c12ed7bbb6558d310429a0ae24023/coverage-7.10.7-py3-none-any.whl#sha256=f7941f6f2fe6dd6807a1208737b8a0cbcf1cc6d7b07d24998ad2d63590868260'
          SYNC_COVERAGE_PYTHON="$RUNNER_TEMP/sync-coverage-venv/bin/python" bash scripts/measure-sync-coverage.sh "$RUNNER_TEMP/sync-coverage.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-coverage
          path: ${{ runner.temp }}/sync-coverage.xml
          if-no-files-found: error

  protected-sonar:
    name: Protected SonarCloud dispatch
    needs: sync-coverage
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The child scan is bounded at 20 minutes; the margin covers queueing.
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Dispatch and watch the main-owned scan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # API version 2026-03-10 returns the dispatched run's ID.
          child="$(gh api -X POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GH_REPO/actions/workflows/sonarcloud.yml/dispatches" \
            -f ref=main -f "inputs[caller_run_id]=$RUN_ID" -f "inputs[caller_run_attempt]=$RUN_ATTEMPT" \
            -f "inputs[pr_number]=$PR_NUMBER" -f "inputs[expected_head_sha]=$HEAD_SHA" \
            -f "inputs[expected_base_sha]=$BASE_SHA" --jq '.workflow_run_id')"
          if [[ ! "$child" =~ ^[1-9][0-9]{0,18}$ ]]; then
            echo "::error::Dispatch returned no run ID."
            exit 1
          fi
          echo "Protected SonarCloud run: https://github.com/$GH_REPO/actions/runs/$child" >> "$GITHUB_STEP_SUMMARY"
          # A successful dispatch can reply before the run endpoint is readable.
          # Wait for this exact ID to register without sending another dispatch.
          for (( registration_attempt=1; registration_attempt<=10; registration_attempt++ )); do
            if registered="$(gh api "repos/$GH_REPO/actions/runs/$child" --jq '.id' 2>&1)"; then
              if [[ "$registered" != "$child" ]]; then
                echo "::error::Protected SonarCloud run ID did not match the dispatch receipt."
                exit 1
              fi
              gh run watch "$child" --exit-status --interval 20
              exit
            fi
            if [[ "$registered" != *"HTTP 404"* ]] || (( registration_attempt == 10 )); then
              echo "::error::Could not verify registration of the dispatched SonarCloud run."
              exit 1
            fi
            sleep 2
          done

  reject-disabled-dispatch:
    name: Reject non-main dispatch
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject non-main protected dispatch
        run: |
          echo "::error::Protected SonarCloud dispatch was not loaded from main."
          exit 1

  sonarcloud:
    name: SonarCloud
    needs: sync-coverage
    # The only job that reads SONAR_TOKEN. `protected-sonar` admits main only,
    # so a pull_request run (ref refs/pull/N/merge) never receives the token.
    # !cancelled() lets the dispatch path run although sync-coverage skips there.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.sync-coverage.result == 'success') || github.event_name == 'workflow_dispatch') }}
    environment: protected-sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for new-code detection and blame
          persist-credentials: false
      - name: Download main coverage
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sync-coverage
          path: ${{ runner.temp }}/sync-coverage
      - name: Install pinned XML parser
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/protected-sonar-venv"
          "$RUNNER_TEMP/protected-sonar-venv/bin/python" -m pip install --only-binary=:all: --require-hashes --no-deps -r scripts/requirements-protected-sonar.txt
      - name: Verify caller and prepare inert PR tree
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          CALLER_RUN_ATTEMPT: ${{ inputs.caller_run_attempt }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.expected_head_sha }}
          BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/protected-sonar-venv/bin/python" -I -B scripts/protected_sonar.py \
            --caller-run-id "$CALLER_RUN_ID" --caller-run-attempt "$CALLER_RUN_ATTEMPT" \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA" \
            --analysis-dir "$RUNNER_TEMP/protected-sonar-analysis" \
            --coverage-out "$RUNNER_TEMP/protected-sonar-coverage.xml"
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && format('-Dsonar.projectBaseDir={0}/protected-sonar-analysis -Dsonar.qualitygate.wait=true', runner.temp) || format('-Dsonar.python.coverage.reportPaths={0}/sync-coverage/sync-coverage.xml', runner.temp) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
